[package]
name = "shopify-price-fixer"
version = "1.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", features = ["now"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
reqwest = "0.13"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
csv = "1.3.0"
rust_decimal = "1.39.0"
simple-mass = { git = "https://codeberg.org/areif-dev/simple-mass-rs", tag = "v0.1.1" }
gtin = { git = "https://codeberg.org/areif-dev/gtin", tag = "v1.1.0" }
abc-product = { git = "https://github.com/areif-dev/abc-product", tag = "v1.2.1" }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
